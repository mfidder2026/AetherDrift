# Generate the Xcode project with:  cd app && xcodegen
name: AetherDrift
options:
  bundleIdPrefix: app.fremen
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: nl
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.5.0"
targets:
  AetherDrift:
    type: application
    platform: macOS
    sources:
      - AetherDrift
    dependencies:
      - package: GRDB
      - package: SwiftMarkdown
        product: Markdown
    info:
      path: AetherDrift/Resources/Info.plist
      properties:
        CFBundleDisplayName: AetherDrift
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 AetherDrift"
        LSMinimumSystemVersion: "14.0"
    entitlements:
      path: AetherDrift/Resources/AetherDrift.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fremen.AetherDrift
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Bundle engine and uv
        script: |
          "${SRCROOT}/scripts/bundle-engine.sh"
        basedOnDependencyAnalysis: false
      - name: Bundle Python runtime (Release)
        script: |
          "${SRCROOT}/scripts/bundle-runtime.sh"
        basedOnDependencyAnalysis: false
  AetherDriftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AetherDriftTests
    dependencies:
      - target: AetherDrift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.fremen.AetherDriftTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AetherDrift.app/Contents/MacOS/AetherDrift"
schemes:
  AetherDrift:
    build:
      targets:
        AetherDrift: all
        AetherDriftTests: [test]
    test:
      targets:
        - AetherDriftTests
